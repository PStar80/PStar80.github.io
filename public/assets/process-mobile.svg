<g id="web-apis"><rect x="246" y="674" width="206" height="50" fill="#071A29" stroke="#25B8D6" stroke-width="1.5" /><text x="349" y="706" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">Web APIs</text></g>
