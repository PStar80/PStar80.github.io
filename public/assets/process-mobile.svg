<path id="dropbox-local" d="M360 138V180" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)" /><path d="M360 138V180" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main" />
<path id="operator-local" d="M212 209H268" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)" /><path d="M212 209H268" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main" />
