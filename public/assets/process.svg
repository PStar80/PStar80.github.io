<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-profile-layout="3" data-architecture="cloud-local-relay-v2" width="936" height="550" viewBox="12 76 936 550" role="img" aria-labelledby="title desc" data-motion="static">
<title id="title">Development Process Flow</title>
<desc id="desc">Cloud Agent connects to the Operator and to Dropbox. Dropbox relays work artifacts to the Local Agent; the Operator initiates the Local Agent. Operator and Local Agent both use React UI / Node.js Core API. One arrow leads to Execution Capabilities containing Registered Tools, Embedded AI Agents and Published Workflows. One arrow leads to Automation Endpoints containing File System, Database, Git Repositories and Web APIs from left to right. The cloud/local relay illustrates the current development setup. Configured permissions apply. Static reduced-motion version.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111C" /><stop offset=".55" stop-color="#07131F" /><stop offset="1" stop-color="#020A12" /></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8E7EE" /><stop offset=".10" stop-color="#3C596D" /><stop offset=".26" stop-color="#9DB5C4" /><stop offset=".42" stop-color="#1F3547" /><stop offset=".57" stop-color="#6B96B1" /><stop offset=".72" stop-color="#E3F4FF" /><stop offset=".84" stop-color="#365569" /><stop offset="1" stop-color="#91ACBF" /></linearGradient>
<linearGradient id="accent"><stop stop-color="#25D6FF" /><stop offset="1" stop-color="#148CFF" stop-opacity="0" /></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#40BCFF" stroke-opacity=".055" /></pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#25D6FF" /></marker>
</defs>
