<g id="web-apis"><rect x="711" y="570" width="207" height="40" fill="#071A29" stroke="#25B8D6" stroke-width="1.5" /><text x="814.5" y="598.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">Web APIs</text></g>
