    <!-- Process the giscus OAuth return before analytics scripts can observe the redirect URL. -->
    <script id="giscus-oauth-redirect">
      (() => {
        const url = new URL(window.location.href);
        const session = url.searchParams.get('giscus');
        if (!session) return;
        url.searchParams.delete('giscus');
        window.history.replaceState(window.history.state, document.title, url.pathname + url.search + url.hash);
        try { window.localStorage.setItem('giscus-session', JSON.stringify(session)); }
        catch { /* The regular giscus sign-in is unavailable if browser storage is blocked. */ }
      })();
    </script>
